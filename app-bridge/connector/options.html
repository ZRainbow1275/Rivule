<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Rivule 连接器</title><style>body{font:15px/1.6 system-ui;max-width:640px;min-width:360px;padding:20px;color:#183e31}label{display:block;margin-top:14px}textarea,input{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #adbfb3;border-radius:5px}button{padding:9px 14px;margin:12px 8px 0 0;background:#14664e;color:white;border:0;border-radius:5px;cursor:pointer}#status{white-space:pre-wrap;background:#f0f5ed;padding:12px}small{color:#52675e}</style></head><body><h2>只连接一个明确的任务会话</h2><p id="status" role="status">读取状态…</p><label for="config">从工作台复制的私密配置</label><textarea id="config" rows="6" autocomplete="off" spellcheck="false"></textarea><label for="url">准确会话 URL（不带查询或片段）</label><input id="url" type="url" autocomplete="off"><small>先在原网页打开指定 Pro / Gemini 任务模式。扩展不会切换模型、登录、处理验证码或点击工具审批。</small><div><button id="save">保存并保持停用</button><button id="arm">启用</button><button id="disarm">停用</button><button id="clear">清除凭据</button></div><p><small>每个用户使用独立浏览器 profile。关闭浏览器或恢复后，未确认的发送标为 unknown，不自动重发。每 7 天从工作台重新续绑。</small></p><script type="module" src="options.js"></script></body></html>
