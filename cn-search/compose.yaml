services:
  regional-worker:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      FETCH_ENGINE: moli
      BRIDGE_ORIGIN: ${BRIDGE_ORIGIN:?set one HTTPS bridge origin}
      WORKER_TOKEN: ${WORKER_TOKEN:?set the worker bearer token}
    volumes:
      - worker-spool:/var/lib/regional-worker
    tmpfs:
      - /tmp:size=134217728,mode=1777,noexec,nosuid,nodev
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    ulimits:
      core: 0
      nofile: 1024
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  worker-spool:
