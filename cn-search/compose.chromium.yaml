# Explicit compatibility deployment; never run beside the Moli instance.
services:
  regional-worker:
    image: ${COMPOSE_PROJECT_NAME:-rivule-cn-search}-regional-worker:chromium-1.61.0
    build:
      dockerfile: Dockerfile.chromium
    security_opt:
      - seccomp=./chromium-seccomp.json
    environment:
      FETCH_ENGINE: chromium
    shm_size: 256m
    pids_limit: 256
