<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>Rivule · 主 Agent 调度台</title>
<style>
:root{color-scheme:dark;--bg:#101c1b;--paper:#172b28;--line:#395048;--mint:#b7dfad;--ink:#e9efe1;--muted:#acc1b3;--warn:#ffc479;--haze:#d1c8f0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#283d28 0,transparent 38%),var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{width:min(1020px,92vw);margin:auto;padding:43px 0 55px}h1,h2,p{margin:0}header p{margin-top:9px;color:var(--muted)}h1{font-size:clamp(32px,6vw,60px);line-height:1.1;letter-spacing:-.055em}h1 span{color:var(--mint)}.kicker{font-size:13px;color:var(--mint);letter-spacing:.17em;margin-bottom:12px}small{color:var(--muted)}.board{margin-top:20px;padding:22px;border:1px solid var(--line);border-radius:22px;background:rgba(23,43,40,.86)}.board>header{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.step{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:17px 0}.step button{border:1px solid var(--line);background:#203630;color:var(--ink);font:inherit;font-size:13px;border-radius:10px;min-height:43px;cursor:pointer}.step button[aria-pressed=true]{background:var(--mint);color:#162820;font-weight:750;border-color:var(--mint)}button:focus-visible{outline:3px solid var(--warn);outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:17px 0}.lane{padding:13px;border:1px solid var(--line);border-radius:16px;background:#1b2c27;min-width:0}.lane h2{font-size:14px;color:var(--muted);margin-bottom:9px}.lane article{min-height:118px;border-radius:12px;background:#233931;border:1px solid #557365;padding:10px;margin:6px 0}.lane article h3{margin:0 0 4px;font-size:16px}.lane article p{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.state{display:inline-block;border-radius:25px;background:#354e40;color:var(--mint);padding:2px 9px;font-size:12px;margin:3px 0}.needs_review .state{background:#50402a;color:var(--warn)}.blocked .state,.reported .state{background:#40394c;color:var(--haze)}.footer{color:var(--muted);font-size:13px;padding-top:7px}.note{min-height:52px;color:var(--ink)}.place{color:var(--mint);border:1px solid #4a6351;padding:2px 7px;border-radius:7px;white-space:nowrap;font-size:12px}
select{max-width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 12px;margin:12px 0 2px}label{font-size:14px;color:var(--muted);margin-right:6px}select:focus-visible,button:focus-visible{outline:2px solid var(--warn);outline-offset:3px}
.sync-rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.sync-rail[hidden],.grid[hidden]{display:none}#access-lock{background:#20342d;border:1px solid var(--line);border-radius:12px;color:var(--muted);padding:14px}.sync-tile{min-width:0;padding:9px 10px;background:#20342d;border:1px solid var(--line);border-radius:10px}.sync-tile strong,.sync-tile small{display:block;overflow-wrap:anywhere}.sync-tile[data-kind=lag] strong{color:var(--warn)}.sync-tile[data-kind=steady] strong{color:var(--mint)}
@media(max-width:680px){main{padding-top:25px}.board{padding:12px}.grid{grid-template-columns:1fr}.step{grid-template-columns:repeat(3,1fr)}}
</style>
<main><header><p class="kicker">RIVULE / COORDINATION LAB</p><h1>一项任务，<span>各路并行。</span></h1><p>用同一份任务记录，回放地区隔离、掉线查回执、撤权和主 Agent 验收。</p></header>
<section class="board"><header><div><h2>调度回放</h2><small id="clock"></small></div><span class="place">模拟数据 · 无联网</span></header>
<label for="scenario">演练场景</label> <select id="scenario">
<option value="qwen">QwenPaw 断流，Glean 继续</option>
<option value="viktor">Viktor 等补充，另一项先交付</option>
<option value="coordinator">两个调度窗口断线后对齐</option>
<option value="access">一个窗口撤权，另一项继续</option>
<option value="dispatch">同样会做，该派给谁？</option>
<option value="reviewed">预算变了，另一项照走</option>
<option value="egress">按下派送后，授权撤回了</option>
<option value="settled">迟到的失败回包</option>
<option value="skill">MCP 工具变更，旧批准暂停</option>
<option value="muse">两个独立 Muse 席位</option>
</select>
<nav id="steps" class="step" aria-label="回放步骤"></nav><p id="caption" class="note" aria-live="polite"></p>
<div id="sync-rail" class="sync-rail" hidden aria-label="两个窗口的同步状态"></div>
<div id="access-rail" class="sync-rail" hidden aria-label="窗口访问状态"></div>
<p id="access-lock" hidden role="status">窗口 A 不显示任务。等新的授权会话加载后再恢复。</p>
<div id="egress-rail" class="sync-rail" hidden aria-label="发送边界与回执"></div>
<div id="reviewed-rail" class="sync-rail" hidden aria-label="派送前复核与执行状态"></div>
<div id="dispatch-rail" class="sync-rail" hidden aria-label="派工前核对席位"></div>
<div id="settled-rail" class="sync-rail" hidden aria-label="回包与交付状态"></div>
<div id="skill-rail" class="sync-rail" hidden aria-label="本地工具的审核与执行状态"></div>
<div class="grid" id="lanes"><section class="lane"><h2 id="first-heading">境内独立</h2><div id="cn"></div></section><section class="lane"><h2 id="second-heading">海外公共材料</h2><div id="foreign"></div></section><section class="lane"><h2>主任务依赖</h2><div id="join"></div></section></div>
<p class="footer">回放使用本地测试记录。示例席位和批准不调用外部服务，也不会改动线上 Rivule。</p>
</section></main>
<script>
{{CODE}}
const tracks={
 qwen:{phases:verifiedQwenReplay,
  labels:['拆分','派工','断线','海外验收','核回国内','解锁合稿'],
  names:{'china-proof':'境内公开材料','overseas-proof':'海外公开材料',merge:'两份材料合稿'},
  workers:{qwen:'QwenPaw 境内示例',international:'Glean 海外示例'},cn:'china-proof',merge:'merge'},
 viktor:{phases:verifiedViktorReplay,labels:['接单','待补充','冷启动复核','另一项验收'],
  names:{'public-date':'核对公开日期',peer:'独立公开资料',merge:'合稿'},
  workers:{'viktor-actor':'Viktor 示例','independent':'Glean 示例'},cn:'public-date',merge:'merge',
  headings:['Viktor · 海外','独立任务 · 海外'],defaultStep:1},
 coordinator:{phases:verifiedCoordinatorReplay,labels:['已同步','窗口断线','原任务验收','重连补齐','忽略迟到'],
  names:{'public-source':'核对公开来源','editor-note':'独立编辑任务',merge:'汇总材料'},
  workers:{helper:'原派送示例'},cn:'public-source',merge:'merge',
  headings:['窗口 A · 当前任务','窗口 A · 独立任务'],defaultStep:0},
 access:{phases:verifiedAccessReplay,labels:['有权查看','撤销访问','独立任务完成','重新获权','重新同步'],
  names:{'public-source':'核对公开来源','editor-note':'独立编辑任务',merge:'汇总材料'},
  workers:{helper:'示例工作者'},cn:'public-source',merge:'merge',
  headings:['窗口 A · 原任务','窗口 A · 独立任务'],defaultStep:0},
 dispatch:{phases:verifiedDispatchReplay,labels:['核地区与授权','席位忙碌','核对备选预算','领取待派送'],
  names:{'public-source':'整理境内公开来源',independent:'独立核对任务',merge:'汇总材料'},
  workers:{'desk-cn':'境内示例席位','desk-spare':'境内备选席位'},cn:'public-source',merge:'merge',
  headings:['本次拟派任务','独立任务'],defaultStep:0},
 reviewed:{phases:verifiedReviewedReplay,labels:['已领取','预算变动','另一项照走','重新选择','重新核准'],
  names:{original:'核对国内公开资料',independent:'独立编辑任务',merge:'汇总材料'},
  workers:{'selected-seat':'境内示例席位','independent-seat':'独立示例席位'},cn:'original',merge:'merge',
  headings:['等待预算复核的任务','独立任务'],defaultStep:1},
 egress:{phases:verifiedEgressReplay,labels:['登记派送','授权撤回','独立项收到','冷启动核回执'],
  names:{prepared:'原任务',parallel:'另一项独立核对',merge:'汇总材料'},
  workers:{'first-demo':'原示例席位','second-demo':'独立示例席位'},cn:'prepared',merge:'merge',
  headings:['原任务 · 发送前','独立任务 · 另一席位'],defaultStep:1},
 settled:{phases:verifiedSettledReplay,labels:['交稿','验收并换任务','旧失败抵达','解锁合稿'],
  names:{'public-source':'核对公开来源',independent:'独立编辑任务',merge:'汇总材料'},
  workers:{helper:'Glean 示例席位'},cn:'public-source',merge:'merge',
  headings:['原任务','同一席位的新任务'],defaultStep:2},
 skill:{phases:verifiedSkillReplay,labels:['发现工具','等待批准','格式变更','复核结果','验收通过'],
  names:{'registry-summary':'统计示例入口',peer:'独立任务',merge:'合稿'},
  workers:{'local-fixture-tool':'本地测试工具'},cn:'registry-summary',merge:'merge',
  headings:['MCP 工具与 Skill','独立任务'],defaultStep:0},
 muse:{phases:runCoordinationExample().phases,
  labels:['拆分','领取','断线','核回','允许合稿','验收完成'],
  names:{'cn-notes':'国内原件核对','overseas-a':'国际材料原文 A','overseas-b':'国际材料原文 B',editorial:'两份公开材料合稿'},
  workers:{local:'境内示例端',seatA:'Muse 示例席位 A',seatB:'Muse 示例席位 B'},cn:'cn-notes',merge:'editorial'}
};
const statuses={ready:'待领',leased:'已领取',submitting:'派送中',running:'已收 · 执行中',reported:'已交稿 · 待验收',accepted:'已验收',needs_review:'待核回执 · 不重发',blocked:'等待前置验收',failed:'失败',canceled:'已取消'};
const cardStatus=x=>x.deliveryState==='owner_input_required'?'待补充资料':statuses[x.state];
const $=x=>document.getElementById(x);let track=tracks.qwen,buttons=[];
function node(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
function loadTrack(key){
 track=tracks[key]??tracks.qwen;
 buttons=track.labels.map((s,i)=>{const b=node('button',String(i+1)+' · '+s);b.type='button';b.onclick=()=>render(i);return b});
 const [first,second]=track.headings??['境内独立','海外公共材料'];
 $('first-heading').textContent=first;$('second-heading').textContent=second;
 $('steps').replaceChildren(...buttons);render(track.defaultStep??2);
}
function railTile(title,value,detail,kind){
 const x=node('div','');x.className='sync-tile';x.setAttribute('data-kind',kind);
 x.append(node('small',title),node('strong',value),node('small',detail));return x;
}
function syncRail(sample){
 const rail=$('sync-rail');rail.hidden=!sample;
 if(!sample){rail.replaceChildren();return;}
 rail.replaceChildren(
  railTile('窗口 A',sample.a.state,'修订 '+sample.a.version,sample.a.version<sample.b.version?'lag':'steady'),
  railTile('窗口 B',sample.b.state,'修订 '+sample.b.version,'steady'),
  railTile('派送凭证',sample.permits+' 次','重连只读记录','steady'));
}
const skillStates={
 reviewed_discovery:['已识别','固定工具与 Skill','未批准'],
 awaiting_approval:['待批准','核对本次输入','未批准'],
 holding:['待重新审核','结果格式已变更','旧批准仍未使用'],
 result_for_review:['待验收','仅运行已审核版本','批准已使用'],
 accepted:['已验收','主 Agent 已复核','批准已使用']
};
function skillRail(sample){
 const rail=$('skill-rail');rail.hidden=!sample;
 if(!sample){rail.replaceChildren();return;}
 const [title,detail,approval]=skillStates[sample.phase];
 rail.replaceChildren(
  railTile('审核状态',title,detail,sample.phase==='holding'?'lag':'steady'),
  railTile('本地执行',sample.runs+' 次',approval,'steady'),
  railTile('示例结果',sample.count===undefined?'未生成':sample.count+' 条',sample.phase==='accepted'?'可以合稿':'等待主 Agent 验收','steady'));
}
function accessRail(sample){
 const rail=$('access-rail');rail.hidden=!sample;
 const locked=!!sample&&sample.a.version===null;
 $('access-lock').hidden=!locked;$('lanes').hidden=locked;
 if(!sample){rail.replaceChildren();return;}
 rail.replaceChildren(
  railTile('窗口 A',sample.a.state,locked?'卡片已隐藏':'修订 '+sample.a.version,locked?'lag':'steady'),
  railTile('窗口 B',sample.b.state,'仍有权查看','steady'),
  railTile('独立工作',sample.independentAccepted?'已验收':'待验收','不受窗口 A 影响','steady'));
}
function settledRail(sample,cards){
 const rail=$('settled-rail');rail.hidden=!sample;
 if(!sample){rail.replaceChildren();return;}
 const state=id=>cardStatus(cards.find(c=>c.task===id));
 rail.replaceChildren(
  railTile('原任务',state('public-source'),'主 Agent 验收','steady'),
  railTile('旧失败回包',sample.failedIgnored?'已拒绝':'未到达',sample.failedIgnored?'看板修订不变':'只显示有效交付',sample.failedIgnored?'lag':'steady'),
  railTile('独立任务',state('independent'),'同一席位 · 不受影响','steady'));
}
const dispatchAliases={domestic:'境内主席位',intl:'跨区席位',spare:'境内备选',unbound:'未授权席位'};
const dispatchReasons={
 candidate_for_review:['可供主 Agent 选择','核对信息，无派送权限'],
 region_mismatch:['地区不符','处理流向超出任务范围'],
 lane_busy:['正在占用','按席位排队'],
 budget_unreviewed:['预算待核','先确认本次用量'],
 worker_unavailable:['尚未授权','不进入派工选择'],
 capability_mismatch:['能力不符','继续看其他席位']
};
function dispatchRail(sample){
 const rail=$('dispatch-rail');rail.hidden=!sample;
 if(!sample){rail.replaceChildren();return;}
 const seats=sample.cards.map(({alias,state})=>{
  const [value,note]=dispatchReasons[state];
  return railTile(dispatchAliases[alias],value,note,state==='candidate_for_review'?'steady':'lag');
 });
 if(!seats.length)seats.push(railTile('当前任务','已领取','尚未获得派送许可','steady'));
 rail.replaceChildren(...seats);
}
const reviewedText={
 leased:['已领取，未发送','发送前再核对预算','原任务已领取，独立任务还未开始。'],
 held:['预算待复核','账本修订未变，派送已拦下','预算变了。旧租约还在，原任务没有发送。'],
 independent:['原任务仍待复核','独立席位照常执行','原任务没发出，另一项已接收并执行。'],
 reselect:['租约已到期','旧选择失效，需重新核对','旧租约到期，新预算已核对。主 Agent 重新选席位。'],
 begun:['已重新核准','原任务只产生一次派送记录','新租约经复核，原任务进入模拟派送；合稿仍要等两份验收。']
};
function reviewedRail(sample){
 const rail=$('reviewed-rail');rail.hidden=!sample;
 if(!sample){rail.replaceChildren();return;}
 const [title,note]=reviewedText[sample.phase];
 rail.replaceChildren(
  railTile('预算与租约',title,note,sample.phase==='held'||sample.phase==='independent'?'lag':'steady'),
  railTile('原任务',sample.currentBegins===1?'派送中':'未发送','模拟派送 '+sample.currentBegins+' 次','steady'),
  railTile('独立任务',sample.independentBegins===1?'执行中':'未开始','模拟派送 '+sample.independentBegins+' 次','steady'));
}
const egressCopy={
 armed:['已登记','真正派送前还要再查一次授权。'],
 revoked:['发送前拦截','授权在登记后被撤回；原任务没有发出。'],
 parallel:['另一项照常接收','独立席位已产生模拟回执；原任务仍未发送。'],
 readback:['核回原回执','重启后找回独立项的原回执，没有发第二次。']
};
function egressRail(sample){
 const rail=$('egress-rail');rail.hidden=!sample;
 if(!sample){rail.replaceChildren();return;}
 rail.replaceChildren(
  railTile('发送检查',egressCopy[sample.phase][0],'本地演练，无外部调用',sample.phase==='revoked'?'lag':'steady'),
  railTile('原任务','未发送',sample.phase==='armed'?'等待最后授权核验':'原授权已经失效','lag'),
  railTile('独立任务',sample.second==='accepted'?'有模拟回执':'未开始',sample.phase==='readback'?'沿用原尝试，仅核回执':'独立席位','steady'));
}
function render(i){const f=track.phases[i];syncRail(f.sync);skillRail(f.skill);accessRail(f.access);settledRail(f.settled,f.cards);dispatchRail(f.dispatch);reviewedRail(f.reviewed);egressRail(f.egress);$('clock').textContent=(f.asOfVersion===null?'窗口 A 无可见修订':'记录修订 '+f.asOfVersion)+' · '+String(i+1)+'/'+track.phases.length;$('caption').textContent=f.egress?egressCopy[f.egress.phase][1]:f.reviewed?reviewedText[f.reviewed.phase][2]:f.label;
 buttons.forEach((b,k)=>b.setAttribute('aria-pressed',String(i===k)));
 for(const id of ['cn','foreign','join'])$(id).replaceChildren();
 for(const item of f.cards){const a=node('article','');a.className=item.state;
  a.append(node('h3',track.names[item.task]));const label=f.egress&&item.task==='prepared'?'已登记 · 未发送':f.egress&&item.task==='parallel'&&f.egress.second==='accepted'?'有模拟回执':cardStatus(item);const state=node('span',label);state.className='state';a.append(state);
  a.append(node('p',(track.workers[item.worker]||'未分配')+' · 修订 '+item.taskVersion));
  for(const dep of item.dependencies)a.append(node('p','前置：'+track.names[dep.task]+' · '+statuses[dep.state]));
  $(item.task===track.cn?'cn':item.task===track.merge?'join':'foreign').append(a);
 }}
$('scenario').onchange=e=>loadTrack(e.target.value);
loadTrack('qwen');
</script></html>
